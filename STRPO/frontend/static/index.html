<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Мониторинг датчиков растений</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<h1>Датчики растений</h1>

	<h2>Добавить новый датчик</h2>
	<form id="add-sensor-form">
		<input type="text" id="name" placeholder="Название датчика" required>
		<input type="text" id="plant_name" placeholder="Название растения" required>
		<input type="number" step="any" id="value" placeholder="Значение" required>
		<input type="text" id="unit" placeholder="Единица измерения" required>
		<button type="submit">Добавить</button>
	</form>

	<h2>Список датчиков</h2>
	<table id="sensors-table">
		<thead>
			<tr>
				<th>ID</th>
				<th>Название</th>
				<th>Растение</th>
				<th>Значение</th>
				<th>Ед. изм.</th>
				<th>Дата создания</th>
				<th>Действия</th>
			</tr>
		</thead>
		<tbody id="sensors-list">
			<!-- здесь будут строки -->
		</tbody>
	</table>

	<script src="script.js"></script>
</body>
</html>
