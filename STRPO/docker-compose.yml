version: '3.8'

services:
  db: 
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data # Сохранение данных
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql # Автоинициализация
    networks:
      - app-network 

  backend:
    build: ./backend
    ports:
      - "5000:5000" 
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME} 
    depends_on:
      - db
    networks:
      - app-network

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  pgdata: # Именованный volume для БД

networks:
  app-network:
    driver: bridge